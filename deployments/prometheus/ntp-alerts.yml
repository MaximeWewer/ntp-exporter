# NTP exporter alerting rules for plain Prometheus (rule_files).
# Generated from the Helm PrometheusRule template (deployments/kubernetes/helm/ntp-exporter/templates/prometheusrule.yaml).
# The rules assume the default "ntp" metrics namespace and no subsystem.
groups:
- name: ntp-exporter
  rules:
  - alert: NTPServerDown
    expr: ntp_up == 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: NTP server {{ $labels.server }} does not answer
      description: No response from {{ $labels.server }} during the last collection cycles.
  - alert: NTPServerNoValidResponse
    expr: ntp_response_valid == 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: NTP server {{ $labels.server }} only returns invalid responses
      description: The server answers but its responses cannot be used (Kiss-o'-Death, unsynchronized, invalid stratum...). See ntp_invalid_responses_total for the reason.
  - alert: NTPServerUnsynchronized
    expr: increase(ntp_invalid_responses_total{reason="unsync"}[10m]) > 0
    labels:
      severity: warning
    annotations:
      summary: NTP server {{ $labels.server }} reports it is not synchronized
      description: The server announced leap indicator 3 (alarm condition).
  - alert: NTPOffsetTooHigh
    expr: abs(ntp_offset_seconds) > 0.1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Clock offset of {{ $value | humanizeDuration }} against {{ $labels.server }}
      description: The local clock and {{ $labels.server }} disagree by more than 0.1s.
  - alert: NTPHighPacketLoss
    expr: avg_over_time(ntp_packet_loss_ratio[15m]) > 0.5
    labels:
      severity: info
    annotations:
      summary: High packet loss towards {{ $labels.server }}
      description: More than half of the queries to {{ $labels.server }} went without a valid answer over 15 minutes.
  - alert: NTPKissOfDeathSuspended
    expr: ntp_target_suspended == 1
    labels:
      severity: warning
    annotations:
      summary: NTP server {{ $labels.server }} refused access ({{ $labels.code }})
      description: The server sent a {{ $labels.code }} Kiss-o'-Death code; the exporter stopped querying it for a while.
  - alert: NTPFalseticker
    expr: ntp_falseticker == 1
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: NTP server {{ $labels.server }} disagrees with the other servers
      description: Its correctness interval misses the intersection of the majority of servers (offset from consensus {{ with printf "ntp_offset_from_consensus_seconds{server='%s'}" $labels.server | query
        }}{{ . | first | value | humanizeDuration }}{{ end }}).
  - alert: NTPNTSKeyExchangeFailed
    expr: ntp_nts_ke_success == 0
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: NTS key exchange with {{ $labels.server }} fails
      description: The NTS-KE server (TLS, port 4460) does not deliver keys; authenticated time is not available from {{ $labels.server }}.
  - alert: NTPNTSCertificateExpiringSoon
    expr: ntp_nts_cert_expiry_timestamp_seconds - time() < 14 * 86400
    labels:
      severity: warning
    annotations:
      summary: NTS certificate of {{ $labels.server }} expires soon
      description: The certificate of the NTS key exchange server expires in {{ $value | humanizeDuration }}.
  - alert: NTPKernelUnsynchronized
    expr: ntp_kernel_sync_status == 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Kernel clock of {{ $labels.node }} is not synchronized
      description: The time daemon of the node does not discipline the kernel clock (STA_UNSYNC).
  - alert: NTPKernelErrorBoundViolated
    expr: min_over_time(ntp_kernel_error_bound_violated{bound="maxerror"}[10m]) == 1
    labels:
      severity: critical
    annotations:
      summary: Time daemon of {{ $labels.node }} underestimates its error
      description: The offset measured against {{ $labels.server }} exceeds the maximum error announced by the kernel for 10 minutes.
  - alert: NTPExporterCycleOverrun
    expr: increase(ntp_exporter_cycle_overrun_total[15m]) > 0
    labels:
      severity: info
    annotations:
      summary: NTP exporter collection cycles hit their deadline
      description: Some targets did not answer before the end of the cycle. Lower samples_per_server or the timeout, or raise scrape_interval.
