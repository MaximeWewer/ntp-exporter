# ============================================================================
# NTP Exporter Configuration File
# ============================================================================

# ----------------------------------------------------------------------------
# MODE - required
#   probe: monitor NTP servers from a central place (consensus, falsetickers,
#          Kiss-o'-Death, NTS, pools, /probe)
#   agent: measure the clock of this host (kernel and chrony options)
# Environment variable: NTP_EXPORTER_MODE
# ----------------------------------------------------------------------------
mode: probe

# ----------------------------------------------------------------------------
# SERVER - HTTP Prometheus server configuration
# ----------------------------------------------------------------------------
server:
  # HTTP server listen address
  # Values: valid IP address or "0.0.0.0" for all interfaces
  # Default: "0.0.0.0"
  address: "0.0.0.0"

  # HTTP server listen port
  # Values: 1-65535
  # Default: 9559
  port: 9559

  # HTTP request read timeout
  # Values: valid Go duration (e.g., "10s", "1m", "500ms")
  # Default: 10s
  read_timeout: 10s

  # HTTP response write timeout
  # Values: valid Go duration (e.g., "10s", "1m", "500ms")
  # Default: 10s
  write_timeout: 10s

  # Prometheus web configuration file (TLS, basic auth, HTTP headers):
  # https://prometheus.io/docs/prometheus/latest/configuration/https/
  # Also settable with --web.config.file or NTP_EXPORTER_WEB_CONFIG_FILE
  # Default: "" (plain HTTP)
  web_config_file: ""

# ----------------------------------------------------------------------------
# PROBE ENDPOINT - /probe?target=host[:port][&samples=N], like blackbox_exporter.
# Prometheus drives the targets through relabeling; the burst fits in the
# scrape timeout announced by Prometheus.
# ----------------------------------------------------------------------------
probe_endpoint:
  # Serve /probe. Anyone reaching the exporter can then make it query any
  # host: restrict the targets below, or the access (network policy, basic
  # auth in the web configuration). Without ntp.servers nor ntp.pools, the
  # exporter only serves /probe.
  # Default: false
  enabled: false

  # CIDR ranges and host name regular expressions (matched against the whole
  # name) /probe may reach. An address in a listed range is always allowed;
  # otherwise loopback, link-local (cloud metadata 169.254.169.254),
  # multicast and unspecified addresses are refused, and with a non-empty
  # list the name must match one of the expressions.
  # Default: [] (any other address)
  allowed_targets: []
  #  - 192.0.2.0/24
  #  - .*\.ntp\.example\.org

# ----------------------------------------------------------------------------
# NTP - NTP client configuration and query strategy
# ----------------------------------------------------------------------------
ntp:
  # List of individual NTP servers to query
  # Values: list of host, host:port, or nts://host[:port] for Network Time
  # Security (RFC 8915, key exchange over TLS port 4460)
  # Default: none, nothing is queried unless configured. Do not mix servers
  # that smear leap seconds (time.google.com, time.cloudflare.com...) with
  # servers that step them: they differ by up to 0.5s around a leap second.
  servers:
  - "ptbtime1.ptb.de"
  - "ptbtime2.ptb.de"
  # NTP pools: a DNS name resolving to several servers. The first max_servers
  # addresses of each DNS answer are queried; public pools rotate their
  # answers, so the members change over time. Probe mode only.
  pools:
  # Pool name (must be DNS resolvable)
  - name: "pool.ntp.org"

    # Number of addresses queried
    # Values: 1-20
    # Default: 4
    max_servers: 4
  # Timeout for each individual NTP query
  # Values: valid Go duration (e.g., "5s", "500ms")
  # Default: 5s
  timeout: 5s

  # NTP protocol version to use
  # Values: 2, 3, 4
  # Default: 4
  version: 4

  # Number of queries sent to each server per cycle (burst). The offset is
  # taken from the sample with the lowest delay (RFC 5905 clock filter).
  # Values: 1-20
  # Default: 4
  samples_per_server: 4

  # Delay between two queries of a burst to the same server. NTP servers
  # rate-limit clients sending packets closer than 2s.
  # Values: valid Go duration
  # Default: 2s
  sample_spacing: 2s

  # Maximum number of servers probed in parallel
  # Values: 1-100
  # Default: 10
  max_concurrency: 10

  # Address family used to reach the servers. In auto mode, families without
  # a route on the host are skipped, and a dual-stack server is queried over
  # the family that answered last, falling back to the other one in the same
  # cycle when it does not answer.
  # Values: auto, ipv4, ipv6
  # Default: auto
  ip_family: auto

  # Interval between two collection cycles. A cycle is cut 10% (at most 1s)
  # before the next one. Keep 60s or more when querying the public NTP pool.
  # Values: 5s-1h
  # Default: 60s
  collection_interval: 60s

  # Responses whose root distance (upper bound of the server error) exceeds
  # this value are invalid: counted with reason="root_distance", never used as
  # a measurement nor by the consensus. ntpd uses 1.5s (MAXDIST), chrony 3s.
  # Values: 100ms-16s
  # Default: 1.5s
  max_root_distance: 1.5s

  # ----------------------------------------------------------------------------
  # KERNEL - Kernel clock state (agent mode, Linux only)
  # Read with an unprivileged read-only adjtimex call
  # ----------------------------------------------------------------------------
  kernel:
    # Expose ntp_kernel_sync_status and ntp_kernel_error_bound_violated (agent
    # mode only). The raw kernel values are node_exporter node_timex_* metrics.
    # Default: unset, enabled in agent mode on Linux
    # enabled: true

  # ----------------------------------------------------------------------------
  # CHRONY - Tracking report of the local chronyd (agent mode): selected
  # source, offset, frequency, skew. Read-only commands are allowed from
  # localhost over UDP 323 by default; with the unix socket, the exporter runs as
  # the chronyd user (it creates its reply socket next to the chronyd socket).
  # ----------------------------------------------------------------------------
  chrony:
    # Agent mode only. Default: unset, enabled in agent mode when chronyd answers
    enabled: false

    # Values: udp://host:port or unix:///path/to/chronyd.sock
    # Default: udp://127.0.0.1:323
    address: udp://127.0.0.1:323

  # ----------------------------------------------------------------------------
  # KISS-O'-DEATH - Handling of KoD codes (RFC 5905 section 7.4)
  # RATE: the server polling interval doubles; DENY/RSTR: the server is suspended
  # ----------------------------------------------------------------------------
  kod:
    # Longest polling interval reached after repeated RATE codes
    # Default: 1024s
    max_backoff: 1024s

    # How long a server stays unqueried after DENY or RSTR
    # Default: 1h
    suspend_duration: 1h

  # ----------------------------------------------------------------------------
  # CONSENSUS - Falseticker detection across servers
  # ----------------------------------------------------------------------------
  consensus:
    # Default (unset): enabled when at least 3 servers or pools are configured
    # enabled: true

  # ----------------------------------------------------------------------------
  # DNS CACHE - Cache of pool DNS answers
  # ----------------------------------------------------------------------------
  dns_cache:
    # TTL used after a resolution failure
    # Default: 5m
    min_ttl: 5m

    # TTL used after consecutive successful resolutions
    # Default: 60m
    max_ttl: 60m

# ----------------------------------------------------------------------------
# LOGGING - Logs go to the standard output (container runtime, journald)
# ----------------------------------------------------------------------------
logging:
  # Log verbosity level
  # Available values: "debug", "info", "warn", "error"
  # Default: "info"
  level: "info"

  # Values: "json" or "console"
  # Default: "json"
  format: "json"

# ----------------------------------------------------------------------------
# METRICS - Prometheus metrics configuration
# ----------------------------------------------------------------------------
metrics:
  # Every metric is prefixed with ntp_.
  # Additional labels to add to ALL metrics
  # Useful for multi-instance identification (e.g., datacenter, region)
  # Values: key-value map (e.g., {datacenter: "us-east-1", env: "prod"})
  # Default: {}
  labels: {}
