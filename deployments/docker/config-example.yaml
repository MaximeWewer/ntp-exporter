# ============================================================================
# NTP Exporter Configuration File
# ============================================================================

# ----------------------------------------------------------------------------
# SERVER - HTTP Prometheus server configuration
# ----------------------------------------------------------------------------
server:
  # HTTP server listen address
  # Values: valid IP address or "0.0.0.0" for all interfaces
  # Default: "0.0.0.0"
  address: "0.0.0.0"

  # HTTP server listen port
  # Values: 1-65535
  # Default: 9559
  port: 9559

  # HTTP request read timeout
  # Values: valid Go duration (e.g., "10s", "1m", "500ms")
  # Default: 10s
  read_timeout: 10s

  # HTTP response write timeout
  # Values: valid Go duration (e.g., "10s", "1m", "500ms")
  # Default: 10s
  write_timeout: 10s

  # Enable TLS/HTTPS
  # Values: true, false
  # Default: false
  tls_enabled: false

  # Path to TLS certificate file (if tls_enabled: true)
  # Values: absolute path to .crt or .pem file
  # Default: ""
  tls_cert_file: ""

  # Path to TLS private key file (if tls_enabled: true)
  # Values: absolute path to .key or .pem file
  # Default: ""
  tls_key_file: ""

# ----------------------------------------------------------------------------
# NTP - NTP client configuration and query strategy
# ----------------------------------------------------------------------------
ntp:
  # List of individual NTP servers to query
  # Values: list of hostnames or IPs (e.g., ["pool.ntp.org", "time.google.com"])
  # Default: ["pool.ntp.org"]
  servers:
  - "pool.ntp.org"
  - "time.google.com"
  - "time.cloudflare.com"
  # NTP pool configuration with selection strategy
  # A pool resolves to multiple IPs via DNS and applies a strategy
  pools:
  # Pool name (must be DNS resolvable)
  - name: "pool.ntp.org"

    # Server selection strategy for the pool
    # Available values:
    #   - "best_n": selects the N best servers (sorted by offset)
    #   - "round_robin": circular rotation between all servers
    #   - "all": queries all servers in the pool
    # Default: "best_n"
    strategy: "best_n"

    # Maximum number of servers to use from the pool (for best_n/round_robin)
    # Values: positive integer (1-100)
    # Default: 4
    max_servers: 4

    # Fallback pool if the primary pool fails (optional)
    # Values: another pool name or ""
    # Default: ""
    fallback: ""
  # Timeout for each individual NTP query
  # Values: valid Go duration (e.g., "5s", "500ms")
  # Default: 5s
  timeout: 5s

  # NTP protocol version to use
  # Values: 2, 3, 4
  # Default: 4
  version: 4

  # Number of queries sent to each server per cycle (burst). The offset is
  # taken from the sample with the lowest delay (RFC 5905 clock filter).
  # Values: 1-20
  # Default: 4
  samples_per_server: 4

  # Delay between two queries of a burst to the same server. NTP servers
  # rate-limit clients sending packets closer than 2s.
  # Values: valid Go duration
  # Default: 2s
  sample_spacing: 2s

  # Maximum number of servers probed in parallel
  # Values: 1-100
  # Default: 10
  max_concurrency: 10

  # Interval between two collection cycles. A cycle is cut 10% (at most 1s)
  # before the next one. Keep 60s or more when querying the public NTP pool.
  # Values: 5s-1h
  # Default: 60s
  scrape_interval: 60s

  # Offset above which ntp_clock_offset_exceeded is set to 1
  # Default: 100ms
  max_clock_offset: 100ms

  # ----------------------------------------------------------------------------
  # KERNEL - Kernel clock state (agent mode, Linux only)
  # Read with an unprivileged read-only adjtimex call
  # ----------------------------------------------------------------------------
  kernel:
    # Expose ntp_kernel_* metrics and ntp_kernel_error_bound_violated
    # Default: false
    enabled: false

    # Only expose ntp_kernel_error_bound_violated and ntp_kernel_sync_status
    # (when node_exporter already exposes node_timex_* metrics)
    # Default: false
    violation_only: false

  # ----------------------------------------------------------------------------
  # KISS-O'-DEATH - Handling of KoD codes (RFC 5905 section 7.4)
  # RATE: the server polling interval doubles; DENY/RSTR: the server is suspended
  # ----------------------------------------------------------------------------
  kod:
    # Longest polling interval reached after repeated RATE codes
    # Default: 1024s
    max_backoff: 1024s

    # How long a server stays unqueried after DENY or RSTR
    # Default: 1h
    suspend_duration: 1h

  # ----------------------------------------------------------------------------
  # CONSENSUS - Falseticker detection across servers
  # ----------------------------------------------------------------------------
  consensus:
    # Default (unset): enabled when at least 3 servers or pools are configured
    # enabled: true

  # ----------------------------------------------------------------------------
  # ADAPTIVE SAMPLING - Adaptive sampling based on drift
  # Automatically increases samples if server drifts too much
  # DISABLED BY DEFAULT (CPU/network overhead)
  # ----------------------------------------------------------------------------
  adaptive_sampling:
    # Enable adaptive sampling
    # Values: true, false
    # Default: false
    enabled: false

    # Default number of samples (if no drift)
    # Values: positive integer (1-50)
    # Default: 3
    default_samples: 3

    # Number of samples if drift detected (> drift_threshold)
    # Values: positive integer (1-100)
    # Default: 10
    high_drift_samples: 10

    # Drift threshold that triggers high sampling
    # Values: valid Go duration (e.g., "50ms", "100ms")
    # Default: 50ms
    drift_threshold: 50ms

    # Maximum time budget for adaptive sampling
    # Values: valid Go duration (e.g., "30s", "1m")
    # Default: 30s
    max_duration: 30s

  # ----------------------------------------------------------------------------
  # DNS CACHE - Cache of pool DNS answers
  # ----------------------------------------------------------------------------
  dns_cache:
    # TTL used after a resolution failure
    # Default: 5m
    min_ttl: 5m

    # TTL used after consecutive successful resolutions
    # Default: 60m
    max_ttl: 60m

# ----------------------------------------------------------------------------
# LOGGING - Log configuration (JSON FORMAT ONLY)
# The zerolog library used produces ONLY structured JSON
# ----------------------------------------------------------------------------
logging:
  # Log verbosity level
  # Available values: "trace", "debug", "info", "warn", "error", "fatal", "panic"
  # Default: "info"
  level: "info"

  # Enable file output (if output: "file")
  # Values: true, false
  # Default: false
  enable_file: false

  # Log file path (if enable_file: true)
  # Values: absolute path to file (e.g., "/var/log/ntp-exporter.log")
  # Default: ""
  file_path: ""

# ----------------------------------------------------------------------------
# METRICS - Prometheus metrics configuration
# ----------------------------------------------------------------------------
metrics:
  # Prometheus namespace for all metrics
  # All metrics will be prefixed with "namespace_"
  # Values: alphanumeric string + underscore
  # Default: "ntp"
  namespace: "ntp"

  # Prometheus subsystem (optional, adds hierarchy level)
  # Metrics become "namespace_subsystem_name"
  # Values: alphanumeric string + underscore or ""
  # Default: ""
  subsystem: ""

  # Additional labels to add to ALL metrics
  # Useful for multi-instance identification (e.g., datacenter, region)
  # Values: key-value map (e.g., {datacenter: "us-east-1", env: "prod"})
  # Default: {}
  labels: {}
