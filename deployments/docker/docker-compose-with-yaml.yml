# NTP exporter configured by a YAML file: every option (pools, Kiss-o'-Death,
# DNS cache, kernel and chrony options...) in one reviewed place.
#   docker compose -f docker-compose-with-yaml.yml up -d
# Environment variables still override the file.

services:
  ntp-exporter:
    image: ${NTP_EXPORTER_IMAGE:-ghcr.io/maximewewer/ntp-exporter:latest}
    command: ["--config", "/etc/ntp-exporter/config.yaml"]
    ports:
      - "${NTP_EXPORTER_PORT:-9559}:9559"
    volumes:
      - ./config-example.yaml:/etc/ntp-exporter/config.yaml:ro
    healthcheck:
      test: ["CMD", "/ntp-exporter", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
