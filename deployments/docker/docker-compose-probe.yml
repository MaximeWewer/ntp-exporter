# NTP exporter in probe mode: monitors NTP servers from a central place.
#   docker compose -f docker-compose-probe.yml up -d
#   curl -s localhost:9559/metrics | grep '^ntp_'
# Every option has an environment variable: see the README.

services:
  ntp-exporter:
    image: ${NTP_EXPORTER_IMAGE:-ghcr.io/maximewewer/ntp-exporter:latest}
    ports:
      - "${NTP_EXPORTER_PORT:-9559}:9559"
    environment:
      # Servers that do not smear leap seconds: do not mix them with smearing
      # servers (time.google.com...), they differ by up to 0.5s around a leap
      # second. 3 servers or more enable the consensus.
      NTP_SERVERS: "${NTP_SERVERS:-ptbtime1.ptb.de,ptbtime2.ptb.de,ptbtime3.ptb.de,nts://nts.netnod.se}"
      NTP_TIMEOUT: "${NTP_TIMEOUT:-2s}"
      # Constant labels added to every series
      METRICS_LABELS: "${METRICS_LABELS:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "/ntp-exporter", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
