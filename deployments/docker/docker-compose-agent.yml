# NTP exporter in agent mode: measures the clock of this host.
#   docker compose -f docker-compose-agent.yml up -d
#   curl -s localhost:9559/metrics | grep '^ntp_'
# The host network gives access to the local time daemon (127.0.0.1) and to
# chronyd over UDP 127.0.0.1:323; no privilege is needed.

services:
  ntp-exporter:
    image: ${NTP_EXPORTER_IMAGE:-ghcr.io/maximewewer/ntp-exporter:latest}
    network_mode: host
    environment:
      NTP_EXPORTER_PORT: "${NTP_EXPORTER_PORT:-9559}"
      NTP_SERVERS: "${NTP_SERVERS:-pool.ntp.org}"
      NTP_TIMEOUT: "${NTP_TIMEOUT:-2s}"
      # Kernel clock state (Linux, read-only adjtimex)
      NTP_KERNEL_ENABLED: "${NTP_KERNEL_ENABLED:-true}"
      # chronyd tracking report, when chronyd runs on the host
      NTP_CHRONY_ENABLED: "${NTP_CHRONY_ENABLED:-false}"
      # Name of the host in the node label of the kernel and chrony metrics
      NODE_NAME: "${NODE_NAME:-}"
      METRICS_LABELS: "${METRICS_LABELS:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "/ntp-exporter", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
