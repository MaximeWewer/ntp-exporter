# NTP exporter in agent mode: measures the clock of this host.
#   docker compose -f docker-compose-agent.yml up -d
#   curl -s localhost:9559/metrics | grep '^ntp_'
# The host network gives access to the local time daemon (127.0.0.1) and to
# chronyd over UDP 127.0.0.1:323; no privilege is needed.

services:
  ntp-exporter:
    image: ${NTP_EXPORTER_IMAGE:-ghcr.io/maximewewer/ntp-exporter:latest}
    network_mode: host
    environment:
      NTP_EXPORTER_MODE: agent
      NTP_EXPORTER_PORT: "${NTP_EXPORTER_PORT:-9559}"
      # At most 2 reference servers
      NTP_EXPORTER_SERVERS: "${NTP_EXPORTER_SERVERS:-pool.ntp.org}"
      NTP_EXPORTER_TIMEOUT: "${NTP_EXPORTER_TIMEOUT:-2s}"
      # Kernel clock state (Linux) and chronyd tracking report are enabled by
      # default, chronyd when it answers: set false to disable them
      NTP_EXPORTER_KERNEL_ENABLED: "${NTP_EXPORTER_KERNEL_ENABLED:-}"
      NTP_EXPORTER_CHRONY_ENABLED: "${NTP_EXPORTER_CHRONY_ENABLED:-}"
      # node label of every series (default: the hostname)
      NODE_NAME: "${NODE_NAME:-}"
      NTP_EXPORTER_METRICS_LABELS: "${NTP_EXPORTER_METRICS_LABELS:-}"
      NTP_EXPORTER_LOG_LEVEL: "${NTP_EXPORTER_LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "/ntp-exporter", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
