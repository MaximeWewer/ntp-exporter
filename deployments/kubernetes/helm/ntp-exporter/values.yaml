# Default values for ntp-exporter
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Deployment mode:
#   - "agent": DaemonSet, measures the clock of every node
#   - "probe": Deployment, monitors NTP servers from a central place
# ("hybrid" is deprecated: use mode=agent with kernel.enabled=true)
# Required: start from values-agent.yaml or values-probe.yaml
mode: ""

# Kernel clock state option (agent mode only, Linux nodes).
# Read with an unprivileged read-only adjtimex call: no privilege required.
kernel:
  # Unset: enabled in agent mode on Linux nodes
  enabled: null

# chronyd tracking report (agent mode): source selected by the daemon, offset,
# frequency, skew... Two ways to reach chronyd on the node:
#   - its UDP command port on 127.0.0.1:323 (read-only commands are allowed
#     from localhost by default): requires hostNetwork: true
#   - its unix socket: set socketDir (e.g. /run/chrony) and runAsUser to the
#     uid of chronyd on the nodes (id -u _chrony): like chronyc, the exporter
#     creates its reply socket in that directory, writable by chronyd only
chrony:
  # Unset: enabled in agent mode when chronyd answers
  enabled: null
  address: udp://127.0.0.1:323
  socketDir: ""
  # uid (and gid, defaulting to the uid) of chronyd on the nodes, required
  # with socketDir
  runAsUser: null
  runAsGroup: null

# Multi-target endpoint /probe?target=host[&samples=N], like blackbox_exporter:
# Prometheus drives the targets through relabeling, so probe replicas hold no
# target list. Disabled by default: anyone reaching the exporter could make it
# query any host.
probeEndpoint:
  enabled: false
  # CIDR ranges and host name regular expressions /probe may reach; empty:
  # any address but loopback, link-local (cloud metadata), multicast
  allowedTargets: []
  # Prometheus Operator Probe resource scraping /probe for each target
  probe:
    enabled: false
    # Namespace of the Probe (defaults to the release namespace)
    namespace: ""
    additionalLabels: {}
    # Keep 60s or more for public servers
    interval: 60s
    # The burst (samples x 2s spacing) must fit in the scrape timeout
    scrapeTimeout: 10s
    # Targets: host or host:port
    targets: []
    #  - time.cloudflare.com
    #  - ptbtime1.ptb.de
    # Labels added to every target
    labels: {}
    metricRelabelings: []

# Number of replicas (only used in probe mode)
replicaCount: 1

image:
  repository: ghcr.io/maximewewer/ntp-exporter
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# NTP Exporter configuration
config:
  # NTP servers to query
  # Servers to query. Agent mode: at most 2 reference servers, preferably
  # inside the site (every node queries them), or none to read the kernel and
  # chronyd only. Probe mode: the servers to monitor (3 or more for the
  # consensus).
  ntpServers: []

  # Port to expose metrics on
  metricsPort: 9559

  # Interval between two collection cycles (64s or more for the public NTP pool)
  scrapeInterval: 60s

  # NTP query timeout
  ntpTimeout: 5s


  # Responses whose root distance exceeds this value are invalid (MAXDIST)
  maxRootDistance: 1.5s

  # Logging configuration
  logging:
    level: info
    format: json

# Prometheus web configuration (TLS, basic auth), see
# https://prometheus.io/docs/prometheus/latest/configuration/https/
# The secret must contain the web configuration file under `key`, plus the
# certificate files it references (paths relative to /etc/ntp-exporter/web).
webConfig:
  existingSecret: ""
  key: web.yml
  # Set to https when the web configuration enables TLS: probes and the
  # ServiceMonitor use HTTPS
  scheme: http
  # Set when the web configuration enables basic auth: probes then only check
  # the port, the kubelet having no password
  basicAuth: false

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# prometheus.io/scrape, port and path annotations, added when the
# ServiceMonitor is disabled (both would scrape every pod twice)
scrapeAnnotations: true

podAnnotations: {}

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 9559
  targetPort: 9559
  annotations: {}
  labels: {}

# ServiceMonitor for Prometheus Operator
# PrometheusRule with the recommended alerts (Prometheus Operator).
# The rules assume the default "ntp" metrics namespace and no subsystem.
prometheusRule:
  enabled: false
  namespace: ""
  additionalLabels: {}
  # Offset above which NTPOffsetTooHigh fires
  offsetThresholdSeconds: 0.1
  # Duration before NTPServerDown fires
  serverDownFor: 5m
  # Days before the NTS certificate expiry when NTPNTSCertificateExpiringSoon fires
  ntsCertExpiryDays: 14
  # Extra rules appended to the group
  additionalRules: []

serviceMonitor:
  # Enable ServiceMonitor creation
  enabled: false
  # Namespace where ServiceMonitor should be created (defaults to release namespace)
  namespace: ""
  # Additional labels for ServiceMonitor
  additionalLabels: {}
  # Scrape interval
  interval: 30s
  # Scrape timeout
  scrapeTimeout: 10s
  # Scheme, TLS and basic auth of the scrape (scheme defaults to webConfig.scheme)
  scheme: ""
  tlsConfig: {}
  basicAuth: {}
  # HonorLabels chooses the metric's labels on collisions with target labels
  honorLabels: true
  # RelabelConfigs to apply to samples before ingestion
  relabelings: []
  # MetricRelabelConfigs to apply to samples before ingestion
  metricRelabelings: []

# Network Policy. The rules are generated from the settings below; set
# ingress or egress to replace them with your own rules.
networkPolicy:
  enabled: false
  # Namespace of Prometheus, matched on its kubernetes.io/metadata.name label
  prometheusNamespace: monitoring
  # Destinations of the NTP queries (UDP 123) and NTS key exchanges (TCP 4460)
  ntpCIDRs:
    - 0.0.0.0/0
    - ::/0
  # Ranges excluded from ntpCIDRs, e.g. the pod and service CIDRs of the cluster
  exceptCIDRs: []
  # Additional egress rules, appended to the generated ones
  extraEgress: []
  # Raw rules replacing the generated ones
  ingress: []
  egress: []

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment
tolerations: []

# Affinity for pod assignment
affinity: {}

# Priority class name
priorityClassName: ""

# Additional volumes
volumes: []

# Additional volume mounts
volumeMounts: []

# Additional environment variables
env: []

# Additional environment variables from ConfigMaps or Secrets
envFrom: []

# Liveness probe: the process answers
livenessProbe:
  httpGet:
    path: /healthz
    port: metrics
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

# Readiness probe: a collection cycle completed recently
readinessProbe:
  httpGet:
    path: /readyz
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Update strategy for DaemonSet
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# Deployment strategy (only used in probe mode)
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Host network mode (useful for accurate NTP measurements)
hostNetwork: false

# DNS policy
dnsPolicy: ClusterFirst

# Termination grace period seconds
terminationGracePeriodSeconds: 30
