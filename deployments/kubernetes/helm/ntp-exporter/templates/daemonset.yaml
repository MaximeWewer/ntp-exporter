{{- if eq (include "ntp-exporter.mode" .) "agent" }}
{{- include "ntp-exporter.validateMode" . -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ntp-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ntp-exporter.labels" . | nindent 4 }}
spec:
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "ntp-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with include "ntp-exporter.podAnnotations" . }}
        {{- . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ntp-exporter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ntp-exporter.serviceAccountName" . }}
      # The exporter never calls the Kubernetes API
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      hostNetwork: {{ .Values.hostNetwork }}
      dnsPolicy: {{ include "ntp-exporter.dnsPolicy" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
      - name: ntp-exporter
        {{- $securityContext := deepCopy .Values.securityContext }}
        {{- if .Values.chrony.socketDir }}
        {{- /* The reply socket is created next to the chronyd socket, in a
               directory only the chronyd user may write to */}}
        {{- $_ := set $securityContext "runAsUser" .Values.chrony.runAsUser }}
        {{- $_ := set $securityContext "runAsGroup" (.Values.chrony.runAsGroup | default .Values.chrony.runAsUser) }}
        {{- end }}
        securityContext:
          {{- toYaml $securityContext | nindent 10 }}
        image: {{ include "ntp-exporter.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        {{- if .Values.args }}
        {{- toYaml .Values.args | nindent 8 }}
        {{- else }}
        - --config=/etc/ntp-exporter/config/config.yaml
        {{- if .Values.webConfig.existingSecret }}
        - --web.config.file=/etc/ntp-exporter/web/{{ .Values.webConfig.key }}
        {{- end }}
        {{- end }}
        ports:
        - name: metrics
          containerPort: {{ .Values.config.metricsPort }}
          protocol: TCP
          {{- if .Values.hostNetwork }}
          hostPort: {{ .Values.config.metricsPort }}
          {{- end }}
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- include "ntp-exporter.probe" (dict "probe" . "root" $) | nindent 10 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- include "ntp-exporter.probe" (dict "probe" . "root" $) | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        # Sibling mounts: a secret cannot be mounted inside the read-only
        # ConfigMap mount
        - name: config
          mountPath: /etc/ntp-exporter/config
          readOnly: true
        {{- if .Values.webConfig.existingSecret }}
        - name: web-config
          mountPath: /etc/ntp-exporter/web
          readOnly: true
        {{- end }}
        {{- if .Values.chrony.socketDir }}
        - name: chrony-socket
          mountPath: {{ .Values.chrony.socketDir }}
        {{- end }}
        {{- with .Values.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        env:
        - name: NTP_EXPORTER_MODE
          value: {{ include "ntp-exporter.mode" . | quote }}
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        {{- with .Values.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.envFrom }}
        envFrom:
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ include "ntp-exporter.configMapName" . }}
      {{- if .Values.webConfig.existingSecret }}
      - name: web-config
        secret:
          secretName: {{ .Values.webConfig.existingSecret }}
      {{- end }}
      {{- if .Values.chrony.socketDir }}
      # chronyd socket directory of the node: the reply socket is created there
      - name: chrony-socket
        hostPath:
          path: {{ .Values.chrony.socketDir }}
          type: Directory
      {{- end }}
      {{- with .Values.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
