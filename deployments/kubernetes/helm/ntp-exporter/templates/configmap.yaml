{{- include "ntp-exporter.validateMode" . -}}
{{- /* The exporter configuration is .Values.config, completed with the values
       the chart drives: /probe and, in agent mode, the kernel and chrony
       options (the mode itself is passed in NTP_EXPORTER_MODE) */}}
{{- $config := deepCopy (.Values.config | default dict) -}}
{{- $probe := dict "enabled" (include "ntp-exporter.probeEndpointEnabled" . | empty | not) -}}
{{- with .Values.probeEndpoint.allowedTargets }}
{{- $_ := set $probe "allowed_targets" . -}}
{{- end }}
{{- $_ := set $config "probe_endpoint" $probe -}}
{{- if eq (include "ntp-exporter.mode" .) "agent" }}
{{- $ntp := deepCopy (get $config "ntp" | default dict) -}}
{{- /* Unset options are enabled when available: kernel on Linux, chrony
       when chronyd answers */}}
{{- $kernel := dict -}}
{{- if not (kindIs "invalid" .Values.kernel.enabled) }}
{{- $_ := set $kernel "enabled" .Values.kernel.enabled -}}
{{- end }}
{{- $chrony := dict "address" (include "ntp-exporter.chronyAddress" .) -}}
{{- if .Values.chrony.socketDir }}
{{- $_ := set $chrony "enabled" true -}}
{{- else if not (kindIs "invalid" .Values.chrony.enabled) }}
{{- $_ := set $chrony "enabled" .Values.chrony.enabled -}}
{{- end }}
{{- $_ := set $ntp "kernel" $kernel -}}
{{- $_ := set $ntp "chrony" $chrony -}}
{{- $_ := set $config "ntp" $ntp -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ntp-exporter.configMapName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ntp-exporter.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
