# =============================================================================
# values-with-yaml-config.yaml
# =============================================================================
# Configuration for running NTP Exporter with a complete YAML config file
# Uses a ConfigMap to mount the full configuration file
# Use: helm install ntp-exporter . -f values-with-yaml-config.yaml
# =============================================================================

mode: agent

# =============================================================================
# IMAGE CONFIGURATION
# =============================================================================
image:
  repository: ntp-exporter
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# =============================================================================
# YAML CONFIG FILE - Full configuration via ConfigMap
# =============================================================================
# This will be mounted at /etc/ntp-exporter/config.yaml
# You can customize this with the full YAML configuration structure
configYaml:
  enabled: true
  # Full YAML configuration (matches deployments/docker/config-example.yaml)
  content: |
    # ============================================================================
    # NTP Exporter Configuration File
    # ============================================================================

    # ----------------------------------------------------------------------------
    # SERVER - HTTP Prometheus server configuration
    # ----------------------------------------------------------------------------
    server:
      address: "0.0.0.0"
      port: 9559
      read_timeout: 10s
      write_timeout: 10s
      tls_enabled: false
      tls_cert_file: ""
      tls_key_file: ""

    # ----------------------------------------------------------------------------
    # NTP - NTP client configuration and query strategy
    # ----------------------------------------------------------------------------
    ntp:
      servers:
      - "pool.ntp.org"
      - "time.google.com"
      - "time.cloudflare.com"

      # NTP pool configuration with selection strategy
      pools:
      - name: "pool.ntp.org"
        strategy: "best_n"
        max_servers: 4
        fallback: ""

      timeout: 5s
      version: 4
      samples_per_server: 4
      sample_spacing: 2s
      max_concurrency: 10
      scrape_interval: 60s

      # Kernel clock state (agent mode only)
      kernel:
        enabled: false
        violation_only: false

      # Kiss-o'-Death handling
      kod:
        max_backoff: 1024s
        suspend_duration: 1h

      # Adaptive sampling
      adaptive_sampling:
        enabled: false
        default_samples: 4
        max_samples: 8
        dispersion_threshold: 10ms
        max_duration: 30s

      # DNS cache of pool answers
      dns_cache:
        min_ttl: 5m
        max_ttl: 60m

    # ----------------------------------------------------------------------------
    # LOGGING - Log configuration (JSON FORMAT ONLY)
    # ----------------------------------------------------------------------------
    logging:
      level: "info"
      enable_file: false
      file_path: ""

    # ----------------------------------------------------------------------------
    # METRICS - Prometheus metrics configuration
    # ----------------------------------------------------------------------------
    metrics:
      namespace: "ntp"
      subsystem: ""
      labels: {}

# =============================================================================
# KUBERNETES RESOURCES CONFIGURATION
# =============================================================================

# Service Account
# Prometheus web configuration (TLS, basic auth), see
# https://prometheus.io/docs/prometheus/latest/configuration/https/
# The secret must contain the web configuration file under `key`, plus the
# certificate files it references (paths relative to /etc/ntp-exporter/web).
# When TLS or basic auth is enabled, adapt the probes (scheme: HTTPS) and the
# ServiceMonitor endpoint accordingly.
webConfig:
  existingSecret: ""
  key: web.yml

serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC
rbac:
  create: true
  annotations: {}

# Pod Annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9559"
  prometheus.io/path: "/metrics"

# Pod Labels
podLabels:
  app.kubernetes.io/component: yaml-config

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
  capabilities:
    drop:
    - ALL

# Service
service:
  type: ClusterIP
  port: 9559
  targetPort: 9559
  annotations: {}
  labels: {}

# ServiceMonitor for Prometheus Operator
# PrometheusRule with the recommended alerts (Prometheus Operator).
# The rules assume the default "ntp" metrics namespace and no subsystem.
prometheusRule:
  enabled: false
  namespace: ""
  additionalLabels: {}
  # Offset above which NTPOffsetTooHigh fires
  offsetThresholdSeconds: 0.1
  # Duration before NTPServerDown fires
  serverDownFor: 5m
  # Extra rules appended to the group
  additionalRules: []

serviceMonitor:
  enabled: true
  namespace: ""
  additionalLabels:
    prometheus: kube-prometheus
  interval: 30s
  scrapeTimeout: 10s
  honorLabels: true
  relabelings: []
  metricRelabelings: []

# Network Policy
networkPolicy:
  enabled: true
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: monitoring
      ports:
      - protocol: TCP
        port: 9559
  egress:
    # Allow DNS
    - to:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53
    # Allow NTP (port 123)
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: UDP
        port: 123
    # Allow HTTPS
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443

# Resources
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists

# Affinity
affinity: {}

# Priority class
priorityClassName: ""

# Additional volumes (ConfigMap will be added automatically)
volumes: []

# Additional volume mounts (ConfigMap will be added automatically)
volumeMounts: []

# Additional environment variables
env:
  # Override log level via environment variable
  - name: LOG_LEVEL
    value: "info"

# Environment from ConfigMaps or Secrets
envFrom: []

# Liveness probe
livenessProbe:
  httpGet:
    path: /metrics
    port: 9559
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

# Update strategy for DaemonSet
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# Deployment strategy (only used in probe mode)
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Host network mode
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

# Termination grace period
terminationGracePeriodSeconds: 30

# =============================================================================
# USAGE NOTES
# =============================================================================
# This configuration uses a ConfigMap to mount the complete YAML configuration
# file at /etc/ntp-exporter/config.yaml
#
# To customize the configuration:
# 1. Edit the 'configYaml.content' section above
# 2. Deploy with: helm install ntp-exporter . -f values-with-yaml-config.yaml
#
# A full YAML file keeps every option (pools, Kiss-o'-Death handling, adaptive
# sampling, DNS cache, kernel option...) in a single reviewed place.
#
# Environment variables can still override YAML values if needed
