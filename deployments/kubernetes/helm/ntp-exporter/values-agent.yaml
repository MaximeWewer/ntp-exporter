# values-agent.yaml
# Configuration for running NTP Exporter in agent mode (DaemonSet)
# Use: helm install ntp-exporter . -f values-agent.yaml

mode: agent

# Kernel clock state option (Linux nodes, unprivileged read-only adjtimex).
# Exposes ntp_kernel_* metrics and ntp_kernel_error_bound_violated, which
# flags nodes whose time daemon underestimates its error.
kernel:
  # Unset: enabled in agent mode on Linux nodes
  enabled: null
  # Set to true when node_exporter already exposes node_timex_* metrics
  violationOnly: false

# Run on all nodes including master
tolerations:
- effect: NoSchedule
  key: node-role.kubernetes.io/master
  operator: Exists
- effect: NoSchedule
  key: node-role.kubernetes.io/control-plane
  operator: Exists

# Higher resource allocation for DaemonSet
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Host network is optional: the pod shares the node clock, so the measured
# offset is the node offset either way
hostNetwork: false

# Update strategy - limit concurrent updates
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# Enable ServiceMonitor for Prometheus Operator
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels:
    prometheus: kube-prometheus

# Network policy: Prometheus ingress, DNS and NTP/NTS egress (see values.yaml)
networkPolicy:
  enabled: true

# NTP configuration optimized for agent mode
config:
  # At most 2 reference servers, preferably inside the site: every node
  # queries them. Without server, the agent reads the kernel and chronyd only.
  # Through the pod network, the offset to a server is only accurate to about
  # half the round-trip delay; chronyd knows the node offset much better.
  ntpServers: []
  #  - ntp1.example.internal
  metricsPort: 9559
  scrapeInterval: 60s
  ntpTimeout: 5s
  maxClockOffset: 50ms
  logging:
    level: info
