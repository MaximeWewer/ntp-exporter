# values-hybrid.yaml
# Configuration for running NTP Exporter in hybrid mode (DaemonSet with kernel monitoring)
# Use: helm install ntp-exporter . -f values-hybrid.yaml

mode: hybrid

# Run on all nodes including master
tolerations:
- effect: NoSchedule
  key: node-role.kubernetes.io/master
  operator: Exists
- effect: NoSchedule
  key: node-role.kubernetes.io/control-plane
  operator: Exists

# Higher resource allocation for hybrid mode with kernel monitoring
resources:
  limits:
    cpu: 300m
    memory: 384Mi
  requests:
    cpu: 150m
    memory: 192Mi

# Host network is NOT required: the pod shares the node clock, so the
# measured offset is the node offset. Enable only if your CNI adds noticeable
# latency or you want the exporter reachable on the node IP.
hostNetwork: false

# Kernel state is read with a read-only adjtimex call (modes=0), which any
# unprivileged process may perform: no root, no privileged mode, no capability.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
  capabilities:
    drop:
    - ALL

# Update strategy - limit concurrent updates
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# Enable ServiceMonitor for Prometheus Operator
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels:
    prometheus: kube-prometheus

# Network policy for host network mode
networkPolicy:
  enabled: true
  egress:
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 123

# NTP configuration optimized for hybrid mode
config:
  ntpServers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  metricsPort: 9561 # Different port to avoid conflicts
  scrapeInterval: 30s
  ntpTimeout: 10s
  maxClockOffset: 50ms
  enableKernel: true # CRITICAL: Enable kernel monitoring
  logging:
    level: info

# Labels to identify hybrid mode
podLabels:
  app.kubernetes.io/component: hybrid
  app.kubernetes.io/mode: daemonset-kernel
  monitoring.ntp/kernel-enabled: "true"
