# values-probe.yaml
# Configuration for running NTP Exporter in probe mode (Deployment)
# Use: helm install ntp-exporter . -f values-probe.yaml

mode: probe

# A single replica: each replica probes every server, so two replicas double
# the load on the servers and every alert (the pod restarts in seconds)
replicaCount: 1

# Standard resources for Deployment
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Use cluster network
hostNetwork: false
dnsPolicy: ClusterFirst

# Deployment strategy
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Pod anti-affinity for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - ntp-exporter
        topologyKey: kubernetes.io/hostname

# Enable ServiceMonitor
serviceMonitor:
  enabled: true
  interval: 60s
  scrapeTimeout: 30s
  additionalLabels:
    prometheus: kube-prometheus

# Network policy: Prometheus ingress, DNS and NTP/NTS egress (see values.yaml)
networkPolicy:
  enabled: true

# /probe endpoint: targets listed in a Prometheus Operator Probe resource are
# measured on demand. Set only=true to drop config.ntpServers and let
# Prometheus drive every target.
probeEndpoint:
  enabled: true
  only: false
  probe:
    enabled: false
    interval: 60s
    scrapeTimeout: 10s
    targets: []
    #  - ptbtime1.ptb.de

# NTP configuration optimized for probe mode
config:
  ntpServers:
  - time.google.com
  - time.cloudflare.com
  - time.apple.com
  metricsPort: 9559
  scrapeInterval: 60s
  ntpTimeout: 2s
  maxClockOffset: 100ms
  logging:
    level: info
    format: json

# Higher priority for centralized probes
priorityClassName: ""
