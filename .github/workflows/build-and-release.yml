name: Build and Release

on:
  push:
    tags:
      - '*.*.*'
      - '*.*.*-*'
  workflow_dispatch:
    inputs:
      force_version:
        # Versioning pattern: YEAR.MONTH.INDEX_OF_TAG (+1 at each tag)
        description: 'Force a specific version (optional, format: YYYY.MM.X)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ntp-exporter
  HELM_CHART_PATH: deployments/kubernetes/helm/ntp-exporter

jobs:
  # =============================================================================
  # Job 1: Prepare Build - Extract version and validate
  # =============================================================================
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      image_name_lower: ${{ steps.lowercase.outputs.image_name_lower }}
      repository_owner_lower: ${{ steps.lowercase.outputs.repository_owner_lower }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Convert names to lowercase
        id: lowercase
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "image_name_lower=${IMAGE_NAME_LOWER}" >> "$GITHUB_OUTPUT"
          echo "repository_owner_lower=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"

          echo "Image name (lowercase): ${IMAGE_NAME_LOWER}"
          echo "Repository owner (lowercase): ${OWNER_LOWER}"

      - name: Generate version
        id: get_version
        env:
          # Inputs go through the environment, never interpolated in the script
          EVENT_NAME: ${{ github.event_name }}
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
        run: |
          # If triggered by a tag push, use the tag
          if [ "$EVENT_NAME" == "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
            # Remove 'v' prefix if present (for backward compatibility with old tags)
            VERSION="${VERSION#v}"
            echo "Using tag: $VERSION"
          # If force_version is provided in workflow_dispatch, use it
          elif [ -n "$FORCE_VERSION" ]; then
            VERSION="$FORCE_VERSION"
            # Remove 'v' prefix if present
            VERSION="${VERSION#v}"
            echo "Using forced version: $VERSION"
          else
            # Auto-generate version based on YEAR.MONTH.INDEX pattern
            # Fetch all tags from remote to ensure we have the latest
            git fetch --tags

            # Get current year and month
            YEAR_MONTH=$(date +'%Y.%m')

            # Get the highest existing tag for current year.month and increment
            # Check both with and without 'v' prefix for backward compatibility
            LATEST_TAG=$(git tag -l "${YEAR_MONTH}.*" "v${YEAR_MONTH}.*" | sed 's/^v//' | sort -V | tail -n 1)

            if [ -z "$LATEST_TAG" ]; then
              # No tags for this year.month, start with .1
              VERSION="${YEAR_MONTH}.1"
            else
              # Extract patch version and increment
              PATCH_VERSION="${LATEST_TAG##*.}"
              NEW_PATCH=$((PATCH_VERSION + 1))
              VERSION="${YEAR_MONTH}.${NEW_PATCH}"
            fi
            echo "Auto-generated version: $VERSION"
          fi

          # The version is interpolated in later steps: only accept a plain version
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Check if this is a pre-release (contains -, alpha, beta, rc)
          if [[ "$VERSION" =~ - ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Release version: ${VERSION}"

  # =============================================================================
  # Job 2: Build Multi-Architecture Binaries
  # =============================================================================
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        include:
          # Linux builds
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          # macOS builds
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # Windows builds
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go-environment

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          # Set binary name based on OS
          BINARY_NAME="ntp-exporter-${{ matrix.goos }}-${{ matrix.goarch }}"

          # Add ARM version suffix if applicable
          if [ -n "${{ matrix.goarm }}" ]; then
            BINARY_NAME="${BINARY_NAME}v${{ matrix.goarm }}"
          fi

          # Add .exe extension for Windows
          if [ "${{ matrix.goos }}" == "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          echo "Building ${BINARY_NAME}..."

          go build -v \
            -ldflags="-w -s \
              -X 'main.version=${{ needs.prepare.outputs.version }}' \
              -X 'main.commit=${GITHUB_SHA}' \
              -X 'main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -trimpath \
            -o "${BINARY_NAME}" \
            ./cmd/ntp-exporter

          echo "BINARY_NAME=${BINARY_NAME}" >> "$GITHUB_ENV"

      - name: Generate checksums
        run: |
          sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"
          md5sum "${BINARY_NAME}" > "${BINARY_NAME}.md5"

      - name: Verify binary (Linux only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          chmod +x "${BINARY_NAME}"
          file "${BINARY_NAME}"
          ./"${BINARY_NAME}" --version || true

      - name: Upload binary artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}
          path: |
            ntp-exporter-*
            *.sha256
            *.md5
          retention-days: 5

  # =============================================================================
  # Job 3: Build Multi-Architecture Docker Images (per platform)
  # =============================================================================
  build-multiarch-images:
    name: Build Docker Images (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform architecture
        run: |
          echo "PLATFORM_ARCH=${platform##*/}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          platforms: ${{ matrix.platform }}

      - name: Generate Docker metadata and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          PLATFORM_ARCH: ${{ env.PLATFORM_ARCH }}
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-${{ env.PLATFORM_ARCH }}
          labels: |
            org.opencontainers.image.title=NTP Prometheus Exporter
            org.opencontainers.image.description=Modern NTP monitoring exporter for Prometheus (${{ env.PLATFORM_ARCH }})
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.vendor=Maxime Wewer
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push platform-specific image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,oci-mediatypes=true

  # =============================================================================
  # Job 4: Create Multi-Architecture Manifest
  # =============================================================================
  create-multiarch-manifest:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [prepare, build-multiarch-images]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate multiarch manifest metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}
          annotations: |
            type=org.opencontainers.image.description,value=Modern NTP monitoring exporter for Prometheus
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Create multiarch manifest and push
        id: manifest-annotate
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create \
            "${tag_args[@]}" \
            --annotation='index:org.opencontainers.image.description=Modern NTP monitoring exporter for Prometheus' \
            --annotation='index:org.opencontainers.image.source=https://github.com/${{ github.repository }}' \
            --annotation='index:org.opencontainers.image.licenses=Apache-2.0' \
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.version }}-amd64 \
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.version }}-arm64 \
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.version }}-v7

      - name: Inspect multiarch manifest
        id: inspect
        run: |
          docker buildx imagetools inspect '${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.version }}'

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # =============================================================================
  # Job 5: Package and Push Helm Chart (OCI)
  # =============================================================================
  build-helm:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    needs: [prepare, create-multiarch-manifest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Update Chart version
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # Update Chart.yaml with new version
          sed -i "s/^version:.*/version: ${VERSION}/" ${{ env.HELM_CHART_PATH }}/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" ${{ env.HELM_CHART_PATH }}/Chart.yaml

          # Update image tag in values.yaml
          sed -i "s/tag:.*/tag: \"${VERSION}\"/" ${{ env.HELM_CHART_PATH }}/values.yaml

          echo "Updated Chart.yaml and values.yaml"
          cat ${{ env.HELM_CHART_PATH }}/Chart.yaml

      - name: Lint Helm chart
        run: |
          helm lint ${{ env.HELM_CHART_PATH }}

      - name: Package Helm chart
        run: |
          helm package ${{ env.HELM_CHART_PATH }} \
            --version ${{ needs.prepare.outputs.version }} \
            --app-version ${{ needs.prepare.outputs.version }}

      - name: Push Helm chart to OCI registry
        run: |
          CHART_FILE="ntp-exporter-${{ needs.prepare.outputs.version }}.tgz"
          helm push "${CHART_FILE}" oci://${{ env.REGISTRY }}/${{ needs.prepare.outputs.repository_owner_lower }}/charts

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-chart
          path: ntp-exporter-*.tgz
          retention-days: 90

  # =============================================================================
  # Job 6: Publish Helm Chart to GitHub Pages (Traditional Helm Repo)
  # =============================================================================
  publish-helm-repo:
    name: Publish Helm Chart to GitHub Pages
    runs-on: ubuntu-latest
    needs: [prepare, build-helm]
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Create gh-pages branch if it doesn't exist
        run: |
          # Check if gh-pages branch exists
          if ! git ls-remote --exit-code --heads origin gh-pages; then
            echo "Creating gh-pages branch..."
            git checkout --orphan gh-pages
            git reset --hard
            git commit --allow-empty -m "Initialize gh-pages branch"
            git push origin gh-pages
            git checkout main
          fi

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Download Helm chart artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-chart
          path: .cr-release-packages

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: deployments/kubernetes/helm
          skip_existing: true
          mark_as_latest: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: "true"

  # =============================================================================
  # Job 7: Create GitHub Release
  # =============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-binaries, create-multiarch-manifest, build-helm, publish-helm-repo]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true

      - name: Download Helm chart
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-chart
          path: helm

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Generate combined checksums file
        run: |
          cd binaries
          sha256sum ntp-exporter-* > ../SHA256SUMS.txt
          cd ..

      - name: Generate release notes
        id: release_notes
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${{ needs.prepare.outputs.version }}^" 2>/dev/null || echo "")

          # Generate changelog
          cat << EOF > release_notes.md
          ## NTP Exporter ${{ needs.prepare.outputs.version }}

          ### What's Changed

          EOF

          if [ -n "$PREVIOUS_TAG" ]; then
            {
              echo "Changes since ${PREVIOUS_TAG}:"
              echo ""
              git log "${PREVIOUS_TAG}..${{ needs.prepare.outputs.version }}" \
                --pretty=format:"* %s (%h)" \
                --no-merges
            } >> release_notes.md
          else
            echo "Initial release" >> release_notes.md
          fi

          cat << EOF >> release_notes.md


          ### Docker Images

          Multi-architecture Docker images are available:

          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.version }}
          \`\`\`

          Supported platforms:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7

          ### Helm Chart

          #### Option 1: Traditional Helm Repository (Recommended for public access)

          \`\`\`bash
          helm repo add ntp-exporter https://${{ github.repository_owner }}.github.io/ntp-exporter
          helm repo update
          helm install my-ntp-exporter ntp-exporter/ntp-exporter --version ${{ needs.prepare.outputs.version }}
          \`\`\`

          #### Option 2: OCI Registry

          \`\`\`bash
          helm install ntp-exporter oci://${{ env.REGISTRY }}/${{ needs.prepare.outputs.repository_owner_lower }}/charts/ntp-exporter \\
            --version ${{ needs.prepare.outputs.version }}
          \`\`\`

          ### Binary Downloads

          Download pre-compiled binaries for your platform below. Verify checksums using SHA256SUMS.txt.

          ### Verification

          Verify binary checksums:
          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          ---

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${{ needs.prepare.outputs.version }}
          EOF

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          files: |
            binaries/ntp-exporter-*
            helm/ntp-exporter-*.tgz
            sbom/sbom.spdx.json
            SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false

      - name: Generate release summary
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release ${{ needs.prepare.outputs.version }} Created Successfully

          ### Artifacts Published

          #### Docker Images
          - \`${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.version }}\`
          - \`${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:latest\`

          #### Helm Chart
          - Traditional Repo: \`https://${{ github.repository_owner }}.github.io/ntp-exporter\`
          - OCI Registry: \`oci://${{ env.REGISTRY }}/${{ needs.prepare.outputs.repository_owner_lower }}/charts/ntp-exporter:${{ needs.prepare.outputs.version }}\`

          #### Binaries
          - Linux (amd64, arm64, armv7)
          - macOS (amd64, arm64)
          - Windows (amd64, arm64)

          ### Links
          - [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.version }})
          - [Docker Image](https://${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }})
          - [Helm Chart Registry](https://${{ env.REGISTRY }}/${{ needs.prepare.outputs.repository_owner_lower }}/charts/ntp-exporter)
          EOF

  # =============================================================================
  # Job 8: Post-Release Verification
  # =============================================================================
  verify-release:
    name: Verify Release
    runs-on: ubuntu-latest
    needs: [prepare, create-release]
    steps:
      - name: Verify Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.version }}
          docker inspect ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name_lower }}:${{ needs.prepare.outputs.version }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to Helm registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Verify Helm chart
        run: |
          helm pull oci://${{ env.REGISTRY }}/${{ needs.prepare.outputs.repository_owner_lower }}/charts/ntp-exporter \
            --version ${{ needs.prepare.outputs.version }}

          helm show chart ntp-exporter-${{ needs.prepare.outputs.version }}.tgz

      - name: Verification summary
        run: |
          {
            echo "## Release Verification Completed"
            echo ""
            echo "All artifacts have been successfully verified:"
            echo "- Docker image is pullable and inspectable"
            echo "- Helm chart is available in OCI registry"
          } >> "$GITHUB_STEP_SUMMARY"
