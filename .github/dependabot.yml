# Weekly updates of the pinned dependencies, one pull request per ecosystem
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  # Actions are pinned by commit SHA: Dependabot updates the SHA and the
  # version comment
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Base images of the Dockerfile, pinned by digest
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
